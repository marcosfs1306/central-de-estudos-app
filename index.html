<!-- TELA 2: PAINEL DE ESTUDOS (DASHBOARD) -->
<div id="viewDashboard" class="hidden">
  
  <!-- Cabeçalho Superior -->
  <header class="dashboard-header">
    <div class="user-info">
      <h2 class="logo">Central de Estudos</h2>
      <p id="userGreeting">Olá, Carregando...</p>
    </div>
    <div class="header-actions">
      <span id="planBadge" class="badge free">FREE</span>
      <button id="btnSair" class="btn-outline">Sair</button>
    </div>
  </header>

  <!-- Corpo Principal do App -->
  <main class="dashboard-grid">
    
    <!-- Bloco 1: A Roleta / Cronômetro -->
    <section class="card roleta-card">
      <h3>Ciclo Atual (Método Meirelles)</h3>
      <div class="materia-destaque">
        <span class="label">Estudar Agora:</span>
        <h4 id="materiaAtualDisplay">Selecione uma matéria...</h4>
      </div>
      <div class="cronometro-container">
        <h1 id="tempoDisplay">00:00:00</h1>
        <div class="botoes-cronometro">
          <button id="btnPlay" class="btn-primary">▶ Iniciar</button>
          <button id="btnStop" class="btn-success">✔ Finalizar Bloco</button>
        </div>
      </div>
    </section>

    <!-- Bloco 2: Gestão de Matérias -->
    <section class="card matérias-card">
      <h3>Disciplinas do Edital</h3>
      <form id="formMateria" class="form-row">
        <input type="text" id="nomeMateria" placeholder="Ex: Direito Constitucional" required>
        <select id="pesoMateria" required>
          <option value="" disabled selected>Peso</option>
          <option value="1">Peso 1</option>
          <option value="2">Peso 2</option>
          <option value="3">Peso 3</option>
        </select>
        <button type="submit" class="btn-primary">+</button>
      </form>
      
      <!-- Lista onde as matérias vão aparecer -->
      <ul id="listaMaterias" class="lista-materias"></ul>
    </section>

  </main>
</div>
